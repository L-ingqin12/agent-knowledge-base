name: Link check

# 外部链接可用性巡检。
#
# 设计取舍（重要）：**不阻断**。
#   外部站点会限流、会临时宕机、会因地域不可达——把「外链 404」当失败，
#   会让门禁频繁飘红而被习惯性忽略（CORRECTIONS C-014：门禁的价值等于其信噪比）。
#   因此本工作流只**报告**，把结果写进 Job Summary，由人决定是否修。
#   真正的硬门禁是 security-scan 与 markdown-validation。
#
# 频率：每周一次 + 手动触发；脚本变更时也跑一次。
#
# 检查逻辑在 scripts/check-links.py（与本地同一实现）：
#   · 词法过滤文档占位符（CVE-XXXX-YYYY、$VAR、{...}）与内网/示意域名
#     ——这些不是可行动的死链，混进报告会淹没真问题
#   · 先 HEAD，失败再 GET（部分站点不支持 HEAD 却正常服务 GET）
#   · worker 永不抛异常，避免整个巡检因单条 URL 崩掉
#     （修复前曾因文档里的 `[IP已脱敏` 被当成 IPv6 字面量而整体崩溃）

on:
  schedule:
    - cron: '0 2 * * 1'      # 每周一 02:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check-links.py'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read

jobs:
  links:
    name: 外链巡检（仅报告）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 巡检外链
        run: python scripts/check-links.py --out linkcheck-report.md

      - name: 写入 Job Summary
        if: always()
        run: |
          if [ -f linkcheck-report.md ]; then
            {
              echo "## 外链巡检结果"
              echo
              head -60 linkcheck-report.md
              echo
              echo "_完整报告见 Artifacts_"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: linkcheck-report.md
          if-no-files-found: warn
